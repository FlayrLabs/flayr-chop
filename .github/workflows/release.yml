name: Release

# Pushing a tag like v1.2.0 builds the Windows installer and the Linux package and
# attaches them to a draft GitHub release. The signed macOS DMG is added from a
# maintainer's Mac with scripts/release-macos.sh --upload, then the draft is published.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DFLAYR_CHOP_COPY_AFTER_BUILD=OFF
          cmake --build build --config Release --parallel 4
          ctest --test-dir build -C Release --output-on-failure
      - name: Installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$pwd\build\FlayrChop_artefacts\Release\VST3" packaging\windows\FlayrChop.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFLAYR_CHOP_COPY_AFTER_BUILD=OFF
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="FlayrChop-$version-Linux-x64"
          mkdir -p "dist/$pkg"
          cp -R "build/FlayrChop_artefacts/Release/VST3/Flayr Chop.vst3" "dist/$pkg/"
          cp -R "build/FlayrChop_artefacts/Release/LV2/Flayr Chop.lv2" "dist/$pkg/"
          cp packaging/linux/install.sh LICENSE "dist/$pkg/"
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  draft:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "Flayr Chop ${tag#v}" --notes-file packaging/RELEASE_NOTES.md
          fi
          gh release upload "$tag" dist/* --clobber
